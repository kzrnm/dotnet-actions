name: Publish NuGet & Release

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Artifact name
        required: true
        type: string
      version:
        description: Build version
        required: true
        type: string
      is-prerelease:
        description: if true, Create release as prerelease.
        required: false
        default: false
        type: boolean
      skip-nuget:
        description: if true, skip push to nuget.
        required: false
        default: false
        type: boolean
      generateReleaseNotes:
        description: Indicates if release notes should be automatically generated.
        default: true
        required: false
        type: boolean
    secrets:
      NUGET_KEY:
        description: "NuGet API key"
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish NuGet & Release
        uses: kzrnm/dotnet-actions/actions/publish@v2
        id: get-version
        with:
          artifact-name: ${{ inputs.artifact-name }}
          version: ${{ inputs.version }}
          is-prerelease: ${{ inputs.is-prerelease }}
          skip-nuget: ${{ inputs.skip-nuget }}
          generateReleaseNotes: ${{ inputs.generateReleaseNotes }}
          NUGET_KEY: ${{ secrets.NUGET_KEY }}
